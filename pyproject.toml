[project]
name = "typegpt"
version = "0.2.0"
description = "TypeGPT is a Python application that allows you to invoke various AI's and LLM's from any text field in your operating system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "google-genai>=2.31.0",
    "openai>=3.35.1",
    "pillow>=13.0.0",
    "pyautogui>=0.9.54",
    "pynput>=1.8.2",
    "pyperclip>=1.11.0",
    "requests>=2.34.2",
]
